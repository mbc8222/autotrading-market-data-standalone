# autotrading-market-data (standalone) — 이 파일 하나로 전부 뜬다.
#
# 실행:   docker compose up -d --build
# 로그:   docker compose logs -f
# 중지:   docker compose down          (데이터 볼륨은 남는다)
# 삭제:   docker compose down -v       (★ DB 데이터까지 지운다)
#
# 본판(main)과의 차이:
#   - Redis 없음. 수집 → PostgreSQL 적재까지만 한다.
#   - 공유 외부망(autotrading-net) 없음. compose 기본망이 서비스 이름을 DNS 로 풀어준다.
#   - PostgreSQL 이 이 compose 안에 있다. 별도 인프라 셋업이 필요 없다.
#
# ★ 설정값은 전부 deploy/market-data.env 한 파일에서 온다(compose 의 ${} 치환이 아니라 env_file 주입).
#   postgres 이미지의 POSTGRES_* 와 앱의 SPRING_* 이 같은 파일에 있으므로 비밀번호를 한 곳만 고치면 안 된다 —
#   POSTGRES_PASSWORD 와 SPRING_DATASOURCE_PASSWORD 를 같은 값으로 맞출 것.
services:
  postgres:
    image: postgres:18
    container_name: md-postgres
    restart: unless-stopped
    # POSTGRES_DB/USER/PASSWORD 는 deploy/market-data.env 에서 온다.
    # 첫 기동(빈 볼륨)에만 동작해 DB·계정을 만든다. 스키마·표는 앱이 Flyway 로 만든다.
    env_file:
      - deploy/market-data.env
    volumes:
      - pgdata:/var/lib/postgresql/data
    # 호스트로 포트를 열지 않는다(앱은 같은 compose 망에서 붙는다).
    # DBeaver/DataGrip 등으로 직접 보거나 호스트에서 bootRun 하려면 아래 주석을 풀되 127.0.0.1 바인딩 유지.
    # ports:
    #   - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  market-data:
    build: .
    image: autotrading-market-data:standalone
    container_name: md-collector
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=prod
    env_file:
      - deploy/market-data.env
    ports:
      # actuator(health·prometheus). 외부에 열 필요가 없으면 127.0.0.1 바인딩을 유지한다.
      - "127.0.0.1:8080:8080"
    volumes:
      # prod 롤링 로그를 호스트에 보존 (컨테이너 재생성에도 유지)
      - ./logs:/var/log/autotrading

volumes:
  pgdata:
