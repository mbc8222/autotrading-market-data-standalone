server.port=8080
spring.application.name=autotrading-market-data

# ── 접속 정보 ────────────────────────────────────────────────────────────────
# 기본값은 로컬 PostgreSQL 을 가정한다. 다르면 환경변수로 덮어쓴다(파일을 고칠 필요 없음):
#   DB_URL / DB_USER / DB_PASSWORD / DB_SCHEMA
# 예) DB_URL=jdbc:postgresql://db.example.com:5432/marketdata?currentSchema=marketdata
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/marketdata?currentSchema=marketdata}
spring.datasource.username=${DB_USER:marketdata}
spring.datasource.password=${DB_PASSWORD:marketdata}
spring.datasource.hikari.maximum-pool-size=10

# Flyway — 위 DataSource 공유. 기동 시 표를 자동 생성한다.
# 앱에 DDL 권한을 주지 않는 환경이면 false 로 끄고 db/migration 의 V*.sql 을 직접 적용한다.
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.default-schema=${DB_SCHEMA:marketdata}
spring.flyway.schemas=${DB_SCHEMA:marketdata}

# Java 21 가상 스레드 — Tomcat 요청 처리 / @Scheduled / @Async 전부 가상 스레드로 실행
spring.threads.virtual.enabled=true

management.endpoint.health.show-details=always
management.endpoints.web.exposure.include=prometheus,health,info,metrics

# ── 수집 ────────────────────────────────────────────────────────────────────
# Binance 선물(fapi) REST — 공개 엔드포인트(인증 불필요). 타임아웃은 폴링 주기(30s)보다 짧게.
binance.rest-base-url=https://fapi.binance.com
binance.connect-timeout=5s
binance.read-timeout=15s

# 수집 대상 — 심볼은 소문자 페어 표준, 전 수집기(kline/파생/WS/raw) 공유
collect.symbols=${COLLECT_SYMBOLS:btcusdt,ethusdt,solusdt,xrpusdt}

# 캔들 (REST 폴링)
collect.kline.enabled=true
collect.kline.intervals=1m,5m,15m,1h
collect.kline.backfill-days=${COLLECT_KLINE_BACKFILL_DAYS:7}
# 1500 -> 1000: 바이낸스 klines 요청 가중치가 limit>1000 에서 10, 501~1000 에서 5 로
# 절반이 된다. 정상 상태에서는 매 요청이 1~2봉만 가져오므로 1500 은 백필에만 의미가 있고
# 상시 가중치만 두 배로 쓰고 있었다. 백필 속도는 느려지지만 상시 부담이 절반이 된다.
collect.kline.page-limit=1000
collect.kline.fixed-delay=30s

# 파생 7종 (/futures/data 6종 + funding, REST 폴링)
collect.futures.enabled=true
collect.futures.fixed-delay=5m

# WebSocket 실시간 (markPrice/depth/forceOrder/aggTrade)
collect.ws.enabled=true

# ── 보존 정책 주의 ───────────────────────────────────────────────────────────
# agg_trade·depth_diff 는 일별 파티션으로 쌓이고, PartitionMaintenance 는 파티션을
# "만들기만" 한다. 지우는 주체가 없으므로 직접 관리해야 한다:
#   DROP TABLE marketdata.agg_trade_pYYYYMMDD;
#   DROP TABLE marketdata.depth_diff_pYYYYMMDD;
# ────────────────────────────────────────────────────────────────────────────

# 원시 집계체결(agg_trade) 적재 + 갭 보정 — 실측 일 ~1.3GB(4심볼).
collect.raw.enabled=${COLLECT_RAW_ENABLED:true}

# 풀북 원시 차분(depth_diff) 적재 — ★실측 일 11~24GB(4심볼). 보존 대책 없이 켜지 말 것.
# false 면 depth 스트림 자체를 구독하지 않는다.
collect.depth.enabled=${COLLECT_DEPTH_ENABLED:false}
